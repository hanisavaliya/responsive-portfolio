<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Student Result Dashboard</title>

<style>
body{
  margin:0;
  padding:20px;
  font-family:Verdana, sans-serif;
  background: linear-gradient(120deg,#a5f3fc,#fda4af);
}

h1{
  text-align:center;
  color:#1f2937;
}

.box{
  max-width:650px;
  margin:auto;
  background:#ffffff;
  padding:20px;
  border-radius:12px;
  box-shadow:0 10px 25px rgba(0,0,0,0.25);
}

.inputs input{
  width:100%;
  padding:10px;
  margin:6px 0;
  border-radius:6px;
  border:2px solid #38bdf8;
  font-size:15px;
}

.buttons{
  margin-top:10px;
}

.buttons button{
  padding:10px;
  margin:4px;
  border:none;
  border-radius:6px;
  font-weight:bold;
  color:white;
  cursor:pointer;
}

.add{background:#22c55e;}
.first{background:#3b82f6;}
.remove{background:#ef4444;}
.removefirst{background:#f97316;}
.change{background:#8b5cf6;}

.buttons button:hover{
  opacity:0.85;
}

.list{
  margin-top:20px;
}

.card{
  background:linear-gradient(to right,#fef3c7,#e0f2fe);
  padding:10px;
  border-radius:8px;
  margin-bottom:8px;
  font-weight:bold;
}

.pass{color:green;}
.fail{color:red;}

.summary{
  margin-top:20px;
  background:#f1f5f9;
  padding:12px;
  border-radius:10px;
}

.summary p{
  margin:6px 0;
  font-size:15px;
}

.summary span{
  color:#1d4ed8;
  font-weight:bold;
}
</style>
</head>

<body>

<h1>🎓 Student Result Dashboard</h1>

<div class="box">

  <div class="inputs">
    <input id="sname" placeholder="Student Name">
    <input id="smarks" type="number" placeholder="Marks">
  </div>

  <div class="buttons">
    <button class="add" onclick="addStudent()">push()</button>
    <button class="first" onclick="addFirst()">unshift()</button>
    <button class="remove" onclick="removeLast()">pop()</button>
    <button class="removefirst" onclick="removeFirst()">shift()</button>
    <button class="change" onclick="editSecond()">splice()</button>
  </div>

  <div class="list" id="studentList"></div>

  <div class="summary">
    <p>Average Marks: <span id="avg">0</span></p>
    <p>Passed Students: <span id="pass">0</span></p>
    <p>Topper: <span id="top">-</span></p>
    <p>Grades: <span id="gradeList">-</span></p>
  </div>

</div>

<script>
let data = [
  {name:"Asha", marks:78},
  {name:"Riya", marks:88},
  {name:"Mehul", marks:34},
  {name:"Karan", marks:92}
];

function grade(m){
  if(m>=80) return "A";
  if(m>=60) return "B";
  if(m>=40) return "C";
  return "Fail";
}

// push
function addStudent(){
  data.push(getData());
  display();
}

// unshift
function addFirst(){
  data.unshift(getData());
  display();
}

// pop
function removeLast(){
  data.pop();
  display();
}

// shift
function removeFirst(){
  data.shift();
  display();
}

// splice
function editSecond(){
  if(data.length>1){
    data.splice(1,1,{name:"Edited",marks:65});
  }
  display();
}

function getData(){
  let n=document.getElementById("sname").value;
  let m=Number(document.getElementById("smarks").value);
  document.getElementById("sname").value="";
  document.getElementById("smarks").value="";
  return {name:n,marks:m};
}

function display(){
  let box=document.getElementById("studentList");
  box.innerHTML="";

  data.forEach(s=>{
    box.innerHTML+=`
      <div class="card">
        ${s.name} - 
        <span class="${s.marks>=40?'pass':'fail'}">
          ${s.marks} (${grade(s.marks)})
        </span>
      </div>
    `;
  });

  calculate();
}

function calculate(){
  // reduce
  let total=data.reduce((sum,s)=>sum+s.marks,0);
  document.getElementById("avg").innerText=
    (total/data.length).toFixed(2);

  // filter
  document.getElementById("pass").innerText=
    data.filter(s=>s.marks>=40).length;

  // sort + destructuring
  let [topper]=[...data].sort((a,b)=>b.marks-a.marks);
  document.getElementById("top").innerText=
    topper.name+" ("+topper.marks+")";

  // map
  document.getElementById("gradeList").innerText=
    data.map(s=>grade(s.marks)).join(", ");
}

display();
</script>

</body>
</html>
